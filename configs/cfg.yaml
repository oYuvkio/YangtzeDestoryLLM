# 通用配置：路径、模型、过滤与实验参数说明（命令行可覆盖）。
# 每一项都标注了被哪个脚本/函数读取以及用途，便于维护与答辩说明。

# 日志配置（如无特殊需求可不改）
logging:
  level: info                               # 日志级别：debug/info/warning/error
  fmt: "%(asctime)s | %(levelname)s | %(message)s"  # 日志格式
  datefmt: "%Y-%m-%d %H:%M:%S"              # 时间格式
  file: ""                                  # 可选日志文件路径，留空则仅输出到控制台

# 路径配置
# 注意：data/ 和 outputs/ 已通过符号链接指向 /media/data2/YangtzeDestoryLLM/
paths:
  output_dir: "outputs/cq_pipeline/final"           # P1-P5 主输出目录；被 scripts/run_cq_pipeline.py、p5_from_tbox.py、run_full_evaluation.py 作为默认结果路径。
  p4_corpus_dir: "data/enhancing_onto_corpus_docs"  # P4 文献增强语料目录；被 scripts/p4_enhance_onto.py -> CQLLMPipeline.run_p4_over_corpus 使用。
  p4_process_dir: "outputs/cq_pipeline/process"     # P4 中间文件（per-doc 建议、聚合）输出目录；scripts/p4_enhance_onto.py 使用。
  p4_final_dir: "outputs/cq_pipeline/final"         # P4 增强 TBox 输出目录；scripts/p4_enhance_onto.py 写入多版 TBox。
  corpus_full: "data/corpus_for_kg/handled_used_kg_corpus"  # 全库语料（切分后）根目录；tools/filter_corpus_light.py、tools/build_eval_pool.py 读取。
  light_pool: "data/corpus_for_kg/filtered_ytz_corpus/light_pool.jsonl"  # 轻过滤输出 jsonl；tools/filter_corpus_light.py 默认写入。
  eval_pool_dir: "data/p5_eval_pool"                # Eval Pool 输出目录（pool/dev/test）；tools/build_eval_pool.py 使用。
  models_cache: "/media/data2/YangtzeDestoryLLM/models_cache"  # 预训练模型缓存目录（HuggingFace/SentenceTransformer）
  logs_archive: "/media/data2/YangtzeDestoryLLM/logs_archive"  # 历史日志归档目录

llm:
  # OpenAI 兼容接口配置（API Key 放 .env）
  # 注：LongCat 的 OpenAI 兼容端点是 /openai/v1，代码会自动补全
  base_url: https://api.longcat.chat/openai/v1
  #"https://api.longcat.chat/openai/v1"   # API 地址（已补全路径）
  model_name: LongCat-Flash-Chat
  #"LongCat-Flash-Chat"               # 模型名称
  temperature: 0.1                        # 温度参数
  max_retries: 2                          # 重试次数
  timeout: 180                             # 超时时间（秒）
  #max_tokens: 8192                        # LongCat 默认需要指定
  #enable_thinking: false                  # 是否启用思考模式（需使用 LongCat-Flash-Thinking 模型）
  request_mode: post
  #disable_response_format: true    # 是否禁用响应格式检查（部分模型可能不支持）

# 分阶段 LLM 配置（可选，不配置则使用上面的默认配置）
llm_per_stage:
  p1:
    model_name: "gpt-4o-mini"
  p2:
    model_name: "gpt-4o-mini"
  p3:
    model_name: "gpt-4o-mini"
  p4:
    model_name: "gpt-4o-mini"
  p5:
    model_name: "gpt-4o-mini"

embedding:
  model_name: "BAAI/bge-base-zh-v1.5"    # 句向量模型，用于去重与 CQ 覆盖度；被 tools/deduplication.py、tools/cq_coverage.py 使用。
  cache_folder: "/media/data2/YangtzeDestoryLLM/models_cache"  # 模型缓存路径

filtering:
  light:
    min_cn_ratio: 0.2                    # 轻过滤最小汉字占比；tools/filter_corpus_light.py 用于粗过滤。
    max_weird_ratio: 0.4                 # 轻过滤最大异常字符比例；tools/filter_corpus_light.py 用于粗过滤。
  eval:
    min_cn_ratio: 0.3                    # Eval Pool 最小汉字占比；tools/build_eval_pool.py 用于粗过滤。
    max_weird_ratio: 0.3                 # Eval Pool 最大异常字符比例；tools/build_eval_pool.py 用于粗过滤。
  keyword_filter: true                   # 是否启用关键词粗筛；filter_corpus_light.py/build_eval_pool.py 共同使用。

eval_pool:
  # 分层策略：source_type（按来源类型）或 topic_label（按主题类型）
  stratify_by: topic_label
  
  # 按 source_type（来源类型）分层的目标配置
  target_source_type:
    law_plan: 60                         # 法案/预案类
    gazette_yearbook: 80                 # 公报/年鉴类
    case_paper: 100                      # 案例/论文类
    news_popular: 60                     # 科普/新闻类
  
  # 按 topic_label（主题类型）分层的目标配置
  target_topic_label:
    disaster_event: 150                  # 灾害事件叙述
    measure_response: 180                # 防治措施/应急响应
    background_analysis: 50              # 致灾因子/背景分析
    institution_regulation: 50           # 制度/法规/流程
    impact_assessment: 10                # 影响与损失评估
  
  dev_ratio: 0.6                         # Eval Pool Dev/Test 划分比例

# P4配置
p4:
  sleep_between_calls: false              # 是否在每次 LLM 调用后随机休眠（避免限流）
  sleep_min_sec: 2                      # 休眠下限秒数
  sleep_max_sec: 5                      # 休眠上限秒数
  min_support: 2                         # 聚合建议的最低支持度；scripts/p4_enhance_onto.py -> CQLLMPipeline.run_p4_over_corpus。
  allow_new_classes: false               # 合并时是否允许新增类；同上。
  align_synonyms: true                   # 是否对建议名称做同义归一；同上，使用 kg.utils.schema_alignment。【已启用，与论文对齐】
  dedup_with_embeddings: true            # 是否对新增类/关系做向量去重；同上，使用 kg.utils.deduplication。【已启用，与论文对齐】
  dedup_threshold: 0.7                   # 去重相似度阈值；同上。【调整为0.7，与论文一致】

# P5配置
p5:
  favor_existing_classes: true           # 抽取提示风格：优先复用已有类（保守）；run_cq_pipeline.py、p5_from_tbox.py 传入 extract_events。
  normalize_entities: false              # 抽取后是否做实体标准化；run_cq_pipeline.py、p5_from_tbox.py 调用 kg.utils.entity_linking。
  min_chars: 800                         # P5 分段最小长度（文本切分）；p5_from_tbox.py 使用。
  max_chars: 2500                        # P5 分段最大长度（文本切分）；p5_from_tbox.py 使用。

# 去重配置（与论文Stage 2对齐）
dedup_schema:
  enabled: true                          # 在 P2/P3 后对类/关系做模式去重；run_cq_pipeline.py 使用 pipeline.deduplicate_tbox。【已启用】
  threshold: 0.7                         # 去重相似度阈值；同上。【调整为0.7，与论文一致】

# 语料三分法配置（P4/P5/EVAL）
# 用于 tools/build_manifest.py 和 filters/apply_manifest.py
# 更新于 2024-12-29：针对 7365 条新数据规模调整
corpus_split:
  # ========== P4 配置（本体增强）==========
  # P4 倾向的来源类型（概念性：定义、规则、制度）
  # 注意：gazette_yearbook 移除，因其包含大量实例性内容（灾情统计、事件记录）
  p4_sources:
    - emergency_plan
    - regulation
    - technical_guideline
    - law_plan            # filter_labels.source_guess 中的值

  # P4 优选的 topic_label
  p4_topic_labels:
    - institution_regulation
    - backgroundanalysis
    - background_analysis
  
  # P4 概念性标志词（增强版）
  p4_keywords:
    - "是指"
    - "定义为"
    - "系指"
    - "包括以下"
    - "分为以下"
    - "具体包括"
    - "按照.*规定"
    - "依据.*标准"
    - "响应级别"
    - "预案启动"
    - "应急响应"
    - "原则"
    - "职责"
    - "流程"
    - "标准"
    - "指标"
    - "术语"
  
  # P4 最低概念得分阈值（得分 >= 此值且实例得分=0 才标 P4）
  p4_min_score: 3
  
  # ========== EVAL 配置（评测）==========
  # EVAL 倾向的来源类型（事件性、案例性文档）
  eval_sources:
    - news
    - case_study
    - news_popular
    - case_paper          # 学术案例论文，包含具体灾害事件分析

  # EVAL 倾向的主题标签
  eval_topic_labels:
    - disasterevent
    - disaster_event
    - impact_assessment
  
  # 实例性标志（事件事实，增强版）
  instance_patterns:
    - '\d{4}年\d{1,2}月\d{1,2}日'
    - '\d{4}年\d{1,2}月'
    - '\d+(\.\d+)?[万亿]?(?:人|亩|元|吨|公顷|平方公里)'
    - '洪峰流量.*?m[³3]/s'
    - '经济损失.*?[万亿]?元'
    - '受灾面积.*?(?:平方公里|km²|hm²|万亩)'
    - '超警\d+天'
    - '水位.*?\d+(\.\d+)?m'
    - '死亡\d+人'
    - '转移\d+[万]?人'
  
  # EVAL 分层抽样目标（按 topic_label）- 针对 ~7000 条数据规模，目标15%（约1100条）
  eval_stratify_targets:
    disasterevent: 300
    disaster_event: 300
    measure_response: 450
    backgroundanalysis: 150
    background_analysis: 150
    institution_regulation: 150
    impact_assessment: 50

  # EVAL 总量上限（约占 15% 的 7365 条）
  eval_max_count: 1100
  
  # EVAL 抽样比例（当不使用分层目标时）
  eval_sample_ratio: 0.3
  
  # ========== 时间隔离（可选）==========
  p4_year_max: null      # 如 2016，年份 <= 此值的概念性语料优先标 P4
  eval_year_min: null    # 如 2017，年份 >= 此值的实例性语料优先标 EVAL
  
  # ========== 拆分配置 ==========
  eval_dev_ratio: 0.6
  seed: 42
  
  # ========== 输出路径配置 ==========
  output_paths:
    manifest: "data/manifests/purpose_manifest.jsonl"
    p4_corpus: "data/corpus_for_onto/p4_only.jsonl"
    p5_corpus: "data/corpus_for_kg/p5_only.jsonl"
    eval_pool: "data/p5_eval_pool/pool.jsonl"
    eval_dev: "data/p5_eval_pool/dev.jsonl"
    eval_test: "data/p5_eval_pool/test.jsonl"

# TBox 去重配置（P2 阶段 Embedding 去重）
tbox_dedup:
  model: "BAAI/bge-base-zh-v1.5"   # SentenceTransformer 模型名称
  sim_th: 0.7                      # 相似度阈值（>= 此值判定为重复并剔除）
  
  review_band: [0.6, 0.7]          # 预留：人工审核区间（当前版本仅做自动去重，不使用）
  batch_size: 32                   # 预留：Embedding 计算批大小（当前由底层模型控制）
  normalize_embeddings: true       # 预留：是否归一化 embedding
  dedup_base: false                # 是否对 base_tbox 内部也做一次去重

  # 元素文本拼接配置（当前主要用于 review 展示）
  text_template:
    class: "{name} || {cn_name} || def:{definition} || examples:{examples}"
    relation: "{name} || {cn_name} || {domain}->{range} || def:{definition}"
    attribute: "{owner}.{name} || {cn_name} || type:{value_type}"

  # 输出配置
  output:
    save_embeddings: false         # 预留：是否保存 embedding 向量（当前未使用）
    review_csv_encoding: "utf-8"  # review.csv 编码
