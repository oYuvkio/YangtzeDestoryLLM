# 通用配置：路径、模型、过滤与实验参数说明（命令行可覆盖）。
# 每一项都标注了被哪个脚本/函数读取以及用途，便于维护与答辩说明。

# 日志配置（如无特殊需求可不改）
logging:
  level: info                               # 日志级别：debug/info/warning/error
  fmt: "%(asctime)s | %(levelname)s | %(message)s"  # 日志格式
  datefmt: "%Y-%m-%d %H:%M:%S"              # 时间格式
  file: ""                                  # 可选日志文件路径，留空则仅输出到控制台

# 路径配置
paths:
  output_dir: "outputs/cq_pipeline/final"           # P1-P5 主输出目录；被 scripts/run_cq_pipeline.py、p5_from_tbox.py、run_full_evaluation.py 作为默认结果路径。
  p4_corpus_dir: "data/enhancing_onto_corpus_docs"  # P4 文献增强语料目录；被 scripts/p4_enhance_onto.py -> CQLLMPipeline.run_p4_over_corpus 使用。
  p4_process_dir: "outputs/cq_pipeline/process"     # P4 中间文件（per-doc 建议、聚合）输出目录；scripts/p4_enhance_onto.py 使用。
  p4_final_dir: "outputs/cq_pipeline/final"         # P4 增强 TBox 输出目录；scripts/p4_enhance_onto.py 写入多版 TBox。
  corpus_full: "data/corpus_for_kg/handle_used_kg_corpus"  # 全库语料（切分后）根目录；tools/filter_corpus_light.py、tools/build_eval_pool.py 读取。
  light_pool: "data/corpus_for_kg/filtered_ytz_corpus/light_pool.jsonl"  # 轻过滤输出 jsonl；tools/filter_corpus_light.py 默认写入。
  eval_pool_dir: "data/corpus_for_kg/eval_pool"                # Eval Pool 输出目录（pool/dev/test）；tools/build_eval_pool.py 使用。

llm:
  # OpenAI 兼容接口配置（API Key 放 .env）
  # 注：LongCat 的 OpenAI 兼容端点是 /openai/v1，代码会自动补全
  base_url: "https://api.longcat.chat/openai/v1"   # API 地址（已补全路径）
  model_name: "LongCat-Flash-Thinking"               # 模型名称
  temperature: 0.1                        # 温度参数
  max_retries: 3                          # 重试次数
  timeout: 60                             # 超时时间（秒）
  max_tokens: 8192                        # LongCat 默认需要指定
  enable_thinking: true                  # 是否启用思考模式（需使用 LongCat-Flash-Thinking 模型）

# 分阶段 LLM 配置（可选，不配置则使用上面的默认配置）
llm_per_stage:
  p1:
    model_name: "gpt-4o-mini"
  p2:
    model_name: "gpt-4o-mini"
  p3:
    model_name: "gpt-4o-mini"
  p4:
    model_name: "gpt-4o-mini"
  p5:
    model_name: "gpt-4o-mini"

embedding:
  model_name: "BAAI/bge-base-zh-v1.5"    # 句向量模型，用于去重与 CQ 覆盖度；被 tools/deduplication.py、tools/cq_coverage.py 使用。

filtering:
  light:
    min_cn_ratio: 0.2                    # 轻过滤最小汉字占比；tools/filter_corpus_light.py 用于粗过滤。
    max_weird_ratio: 0.4                 # 轻过滤最大异常字符比例；tools/filter_corpus_light.py 用于粗过滤。
  eval:
    min_cn_ratio: 0.3                    # Eval Pool 最小汉字占比；tools/build_eval_pool.py 用于粗过滤。
    max_weird_ratio: 0.3                 # Eval Pool 最大异常字符比例；tools/build_eval_pool.py 用于粗过滤。
  keyword_filter: true                   # 是否启用关键词粗筛；filter_corpus_light.py/build_eval_pool.py 共同使用。

eval_pool:
  # 分层策略：source_type（按来源类型）或 topic_label（按主题类型）
  stratify_by: topic_label
  
  # 按 source_type（来源类型）分层的目标配置
  target_source_type:
    law_plan: 60                         # 法案/预案类
    gazette_yearbook: 80                 # 公报/年鉴类
    case_paper: 100                      # 案例/论文类
    news_popular: 60                     # 科普/新闻类
  
  # 按 topic_label（主题类型）分层的目标配置
  target_topic_label:
    disaster_event: 150                  # 灾害事件叙述
    measure_response: 180                # 防治措施/应急响应
    background_analysis: 50              # 致灾因子/背景分析
    institution_regulation: 50           # 制度/法规/流程
    impact_assessment: 10                # 影响与损失评估
  
  dev_ratio: 0.6                         # Eval Pool Dev/Test 划分比例

# P4配置
p4:
  min_support: 2                         # 聚合建议的最低支持度；scripts/p4_enhance_onto.py -> CQLLMPipeline.run_p4_over_corpus。
  allow_new_classes: false               # 合并时是否允许新增类；同上。
  align_synonyms: false                  # 是否对建议名称做同义归一；同上，使用 kg.utils.schema_alignment。
  dedup_with_embeddings: false           # 是否对新增类/关系做向量去重；同上，使用 kg.utils.deduplication。
  dedup_threshold: 0.8                   # 去重相似度阈值；同上。

# P5配置
p5:
  favor_existing_classes: true           # 抽取提示风格：优先复用已有类（保守）；run_cq_pipeline.py、p5_from_tbox.py 传入 extract_events。
  normalize_entities: false              # 抽取后是否做实体标准化；run_cq_pipeline.py、p5_from_tbox.py 调用 kg.utils.entity_linking。
  min_chars: 800                         # P5 分段最小长度（文本切分）；p5_from_tbox.py 使用。
  max_chars: 2500                        # P5 分段最大长度（文本切分）；p5_from_tbox.py 使用。

# 去重配置
dedup_schema:
  enabled: false                         # 在 P2/P3 后对类/关系做模式去重；run_cq_pipeline.py 使用 pipeline.deduplicate_tbox。
  threshold: 0.75                        # 去重相似度阈值；同上。
