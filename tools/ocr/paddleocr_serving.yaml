pipeline_name: PaddleOCR-VL
# 【保守配置】服务器卡顿时，并发设小一点防止 OOM 或超时
batch_size: 4
use_queues: True
use_doc_preprocessor: True 
use_layout_detection: True
use_chart_recognition: False
format_block_content: False

SubModules:
  LayoutDetection:
    module_name: layout_detection
    model_name: PP-DocLayoutV2
    # 【适配】确认后的系统盘路径
    model_dir: /home/zjx/.paddlex/official_models/PP-DocLayoutV2
    batch_size: 2
    threshold:
      0: 0.5
      1: 0.5
      2: 0.5
      3: 0.5
      4: 0.5
      5: 0.4
      6: 0.4
      7: 0.5
      8: 0.5
      9: 0.5
      10: 0.5
      11: 0.5
      12: 0.5
      13: 0.5
      14: 0.5
      15: 0.4
      16: 0.5
      17: 0.4
      18: 0.5
      19: 0.5
      20: 0.45
      21: 0.5
      22: 0.4
      23: 0.4
      24: 0.5
    layout_nms: True
    layout_unclip_ratio: [1.0, 1.0]
    layout_merge_bboxes_mode:
      0: "union"
      1: "union"
      2: "union"
      3: "large"
      4: "union"
      5: "large"
      6: "large"
      7: "union"
      8: "union"
      9: "union"
      10: "union"
      11: "union"
      12: "union"
      13: "union"
      14: "union"
      15: "large"
      16: "union"
      17: "large"
      18: "union"
      19: "union"
      20: "union"
      21: "union"
      22: "union"
      23: "union"
      24: "union"
  
  VLRecognition:
    module_name: vl_recognition
    model_name: PaddleOCR-VL-0.9B
    # 【适配】确认后的系统盘路径
    model_dir: /home/zjx/.paddlex/official_models/PaddleOCR-VL
    batch_size: 2
    genai_config:
      backend: native

SubPipelines:
  DocPreprocessor:
    pipeline_name: doc_preprocessor
    batch_size: 2
    use_doc_orientation_classify: True
    use_doc_unwarping: True
    SubModules:
      DocOrientationClassify:
        module_name: doc_text_orientation
        model_name: PP-LCNet_x1_0_doc_ori
        # 【适配】确认后的系统盘路径
        model_dir: /home/zjx/.paddlex/official_models/PP-LCNet_x1_0_doc_ori
        batch_size: 4
      DocUnwarping:
        module_name: image_unwarping
        model_name: UVDoc
        # 【适配】确认后的系统盘路径
        model_dir: /home/zjx/.paddlex/official_models/UVDoc

Serving:
  extra:
    # 解除页数限制
    max_num_input_imgs: null